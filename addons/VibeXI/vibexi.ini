; VibeXI settings.
;
; Read once when the addon loads: change a value, then reload the addon.
; A missing line, or a missing file, counts as the default.
; Comments go on lines of their own.

[server]
; 1 = this server is HorizonXI (the default). 0 = it is not.
;
; Horizon sends a dozen job abilities -- the Jumps, Shield Bash, Weapon Bash,
; Blade Bash, Eagle Eye Shot -- as weaponskills, under ids that real weaponskills
; also use. With this on, the addon tells the two apart by the result message
; and records the ability as the ability it is.
;
; Set it to 0 on a server that sends job abilities as job abilities. There the
; extra test has nothing to fix and can only misread a real weaponskill.
Horizon=1

[output]
; The folder the event files are written to, one .jsonl file per load of the
; addon. It is created if it does not exist.
;
; It has to be a full path (C:\... or \\server\share\...). %NAME% is replaced
; with that environment variable. If the line is missing or empty, or the folder
; cannot be used, the addon writes to %LOCALAPPDATA%\VibeXI\events instead.
;
; Zerg has to be looking at the same folder: Settings, Events folder.
;
; Keep it out of OneDrive, Dropbox and other synced folders. The file is added
; to several times a second for as long as you play.
EventDir=%LOCALAPPDATA%\VibeXI\events
