<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Zerg overlay spike (Electron)</title>
<!-- Adapted from apps/zerg/spike/OverlaySpike/spike.html. Changes: window.spike
     (preload bridge) instead of chrome.webview, the drag strip is part of the
     page (-webkit-app-region), a "forward mouse moves" toggle, and a few
     page-side probes (timer rate, visibility, forwarded mouse moves, DPR). -->
<style>
  :root { color-scheme: dark; --bg: #14141a; --card: #1f1f29; --line: #2e2e3c;
          --text: #e8e6f0; --muted: #9a98a8; --accent: #d9a441; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
         font: 13px/1.4 "Segoe UI", system-ui, sans-serif; padding: 0 10px 10px;
         display: flex; flex-direction: column; gap: 10px; overflow: hidden;
         user-select: none; }
  /* Keyed mode: the page background goes transparent, so between the cards
     you should see whatever is behind the window -- that is the test. The
     window itself is always transparent:true; this is real per-pixel alpha,
     not a colour key. */
  body.keyed { background: transparent; }
  /* The grip: Windows treats this region as a caption (HTCAPTION), so it drags
     natively. Clicks on it never reach the page. */
  .grip { flex: 0 0 14px; margin: 0 -10px; background: #464656; cursor: move;
          -webkit-app-region: drag; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; padding: 10px 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; color: var(--accent); letter-spacing: .02em; }
  .row { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px;
         align-items: center; margin: 5px 0; font-variant-numeric: tabular-nums; }
  .bar { height: 12px; border-radius: 3px; background: var(--accent);
         transition: width .25s linear; }
  .num { text-align: right; }
  .small { font-size: 11px; color: var(--muted); }
  .tiny { font-size: 10px; color: var(--muted); }
  .clock { font: 600 22px/1 "Cascadia Mono", Consolas, monospace; }
  .controls label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  input[type=range] { flex: 1; }
  button { background: #2c2c3a; color: var(--text); border: 1px solid var(--line);
           border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
  pre { margin: 0; font: 11px/1.35 Consolas, monospace; color: var(--muted);
        white-space: pre-wrap; }
  .state { flex: 1; min-height: 0; overflow: auto; }
</style>
</head>
<body>

<div class="grip" title="Drag to move. Right-click for the menu."></div>

<div class="card">
  <h1>Fake meter &mdash; is it still repainting?</h1>
  <div class="clock" id="clock">00:00.0</div>
  <div id="rows"></div>
  <div class="small">Small muted text: is this readable at 40% over the game?</div>
  <div class="tiny">Tiny text, 10px: Tachi: Jinpu 1,234 &middot; Skillchain 987</div>
</div>

<div class="card controls">
  <h1>Controls</h1>
  <label>Opacity <input type="range" id="opacity" min="10" max="100" value="100">
         <span id="opacityVal">100%</span></label>
  <label><input type="checkbox" id="keyed"> Transparent background (see-through between cards; implies frameless)</label>
  <label><input type="checkbox" id="frameless"> Frameless (rebuilds the window; drag by the grey strip)</label>
  <label><input type="checkbox" id="clickThrough"> Click-through &mdash; <b>Ctrl+Alt+Z</b> turns it off</label>
  <label><input type="checkbox" id="forward" checked> &hellip;and forward mouse moves to the page</label>
  <label><input type="checkbox" id="topmost" checked> Always on top</label>
  <button id="meter">Open real meter (localhost:8731)</button>
  <div class="tiny">Right-click the grey strip (or anywhere) for the same controls.</div>
</div>

<div class="card state">
  <h1>What the window really is</h1>
  <pre id="state">waiting for host&hellip;</pre>
</div>

<script>
  var wv = window.spike;
  function post(o) { if (wv) wv.postMessage(o); }
  function $(id) { return document.getElementById(id); }

  // Animated content, so a window that stops repainting is obvious.
  var names = ['Hasaya', 'Kirin', 'Paradox', 'Zergling', 'Overlord'];
  var dmg = names.map(function () { return 0; });
  $('rows').innerHTML = names.map(function (n, i) {
    return '<div class="row"><span>' + n + '</span><div><div class="bar" id="b' + i +
           '" style="width:0"></div></div><span class="num" id="n' + i + '">0</span></div>';
  }).join('');
  var t0 = performance.now();
  setInterval(function () {
    for (var i = 0; i < dmg.length; i++) dmg[i] += Math.round(Math.random() * 400 * (1 - i * 0.15));
    var max = Math.max.apply(null, dmg) || 1;
    for (i = 0; i < dmg.length; i++) {
      $('b' + i).style.width = (100 * dmg[i] / max).toFixed(1) + '%';
      $('n' + i).textContent = dmg[i].toLocaleString();
    }
  }, 500);

  // Probes: clock ticks and animation frames per second, measured over the last
  // second. Throttling shows up here as ~1 tick/s or 0 fps when unfocused.
  var ticks = 0, frames = 0, tickRate = 0, fps = 0, moves = 0, lastMove = '-';
  setInterval(function () {
    ticks++;
    var s = (performance.now() - t0) / 1000;
    var m = Math.floor(s / 60);
    s = s - m * 60;
    $('clock').textContent = String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
  }, 100);
  (function raf() { frames++; requestAnimationFrame(raf); })();
  setInterval(function () {
    tickRate = ticks; fps = frames; ticks = frames = 0; render();
    post({ cmd: 'probe', ticks: tickRate, fps: fps, vis: document.visibilityState, moves: moves,
           focus: document.hasFocus() });
  }, 1000);
  // With click-through + forward, Windows never delivers clicks here, but
  // Electron still synthesises mousemove from a low-level mouse hook.
  document.addEventListener('mousemove', function (e) { moves++; lastMove = e.clientX + ',' + e.clientY; });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); if (wv) wv.contextMenu(); });

  $('opacity').addEventListener('input', function () {
    $('opacityVal').textContent = this.value + '%';
    post({ cmd: 'opacity', value: +this.value });
  });
  ['keyed', 'frameless', 'clickThrough', 'forward', 'topmost'].forEach(function (id) {
    $(id).addEventListener('change', function () { post({ cmd: id, on: this.checked }); });
  });
  $('meter').addEventListener('click', function () { post({ cmd: 'meter' }); });

  var last = null;
  function yn(b) { return b ? 'yes' : 'no'; }
  function render() {
    var s = last;
    if (!s) return;
    var w = s.win32 || {};
    $('state').textContent =
      'getOpacity()     ' + s.getOpacity.toFixed(2) + '   (asked ' + s.opacity + '%)\n' +
      'isAlwaysOnTop()  ' + s.isAlwaysOnTop + '   focused ' + yn(s.isFocused) + '\n' +
      'HWND             ' + (w.hwnd || '?') + '\n' +
      (w.error ? 'win32            ' + w.error + '\n' :
      'style / ex       ' + w.style + ' / ' + w.exStyle + '\n' +
      '  layered        ' + w.layered + (w.layered ? '   LWA alpha ' + w.lwaAlpha : '') + '\n' +
      '  transparent    ' + w.transparent + '\n' +
      '  topmost bit    ' + w.topmostBit + '\n' +
      '  noredir bitmap ' + w.noRedirBitmap + '\n' +
      '  caption/thick  ' + w.caption + ' / ' + w.thickFrame + '\n' +
      'corner hit-test  ' + w.cornerHit + '   isResizable() ' + s.isResizable + '\n' +
      'dpi (Win32)      ' + w.dpi + '\n') +
      'scaleFactor      ' + s.display.scaleFactor + '   devicePixelRatio ' + window.devicePixelRatio + '\n' +
      'bounds (DIP)     ' + s.bounds.x + ',' + s.bounds.y + ' ' + s.bounds.width + 'x' + s.bounds.height + '\n' +
      'hotkey           ' + (s.hotkey ? 'Ctrl+Alt+Z registered' : 'NOT registered (taken?)') + '\n' +
      'click-through    ' + s.clickThrough + (s.clickThrough ? '  forward ' + s.forward : '') + '\n' +
      'page             ' + tickRate + ' ticks/s  ' + fps + ' fps  ' + document.visibilityState +
                            '  moves ' + moves + ' @' + lastMove + '\n' +
      'memory (all)     ' + s.workingSetMB + ' MB working set, ' + s.procs.length + ' procs\n' +
      '                 ' + s.procs.join(' ') + '\n' +
      'first load       ' + s.firstLoadMs + ' ms after main start;  gpu ' + s.gpu + '\n' +
      'electron         ' + s.versions.electron + '  chromium ' + s.versions.chrome +
                            '  node ' + s.versions.node;
  }

  if (wv) wv.onMessage(function (s) {
    if (!s || s.type !== 'state') return;
    last = s;
    $('opacity').value = s.opacity;
    $('opacityVal').textContent = s.opacity + '%';
    $('keyed').checked = s.keyed;
    $('frameless').checked = s.frameless;
    $('clickThrough').checked = s.clickThrough;
    $('forward').checked = s.forward;
    $('topmost').checked = s.topmost;
    document.body.classList.toggle('keyed', s.keyed);
    render();
  });
  else $('state').textContent = 'Not inside the Electron host (opened in a browser?)';
</script>
</body>
</html>
