<text x="24" y="444.44" font-size="12.5" fill="#E9ECF2" font-weight="600">Draw frequency</text>
<text x="24" y="464.4" font-size="11" fill="#78829A">How many times a second everything that moves with the clock is redrawn: the</text>
<text x="24" y="479.4" font-size="11" fill="#78829A">elapsed time, every DPS and HPS figure, and the right-hand edge of the</text>
<text x="24" y="494.4" font-size="11" fill="#78829A">Cumulative damage and Cumulative healing charts. Whatever an event changes</text>
<text x="24" y="509.4" font-size="11" fill="#78829A">is redrawn as soon as the event arrives. Higher is smoother and uses more</text>
<text x="24" y="524.4" font-size="11" fill="#78829A">processor time.</text>
