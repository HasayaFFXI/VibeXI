<text x="110" y="317.08" font-size="11.5" fill="#E9ECF2">Cancel — keep this pull. Nothing is dropped.</text>
<text x="40" y="52.39" font-size="18" fill="#E9ECF2" font-weight="600" class="d">The tray menu</text>
<text x="40" y="74.58" font-size="11.5" fill="#A6AFBF">What a player reaches for with the game in front and the main window put away.</text>
<text x="40" y="91.58" font-size="11.5" fill="#A6AFBF">Every line is the same command, worded and enabled the same, as the control it</text>
<text x="40" y="108.58" font-size="11.5" fill="#A6AFBF">stands for in the main window.</text>
<text x="40" y="135.37" font-size="9.5" fill="#838DA5" font-weight="600" class="s" letter-spacing="0.7">AFTER RESTART, OVER A RUNNING SESSION</text>
<text x="40" y="415.9" font-size="11" fill="#838DA5">The menu stays open for the answer, as it does today.</text>
<text x="40" y="431.9" font-size="11" fill="#838DA5">Confirm takes the colour of something lost; left alone for</text>
<text x="40" y="447.9" font-size="11" fill="#838DA5">five seconds the pull is kept and the two lines are</text>
<text x="40" y="463.9" font-size="11" fill="#838DA5">themselves again.</text>
<text x="603" y="264.37" font-size="9.5" fill="#838DA5" font-weight="600" class="s" letter-spacing="0.7">OPEN, WITH PANELS</text>
<text x="171" y="478.9" font-size="11" fill="#838DA5">A tick marks a card that is floating.</text>
<text x="171" y="494.9" font-size="11" fill="#838DA5">Choosing a line sends it out or brings it</text>
<text x="171" y="510.9" font-size="11" fill="#838DA5">back.</text>
<text x="353" y="294.9" font-size="11" fill="#838DA5">New: a heading line with the session’s state,</text>
<text x="353" y="310.9" font-size="11" fill="#838DA5">clock and total, so the menu answers “is it</text>
<text x="353" y="326.9" font-size="11" fill="#838DA5">running?” before anything is pressed.</text>
